apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-web
  template:
    metadata:
      labels:
        app: go-web
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/builds-process/go-web
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-web
spec:
  selector:
    app: go-web
  ports:
    - port: 8080
      targetPort: 8080
